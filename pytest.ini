[pytest]
testpaths = tests/components/glt_flow_card
python_files = test_*.py
addopts = --strict-markers -p no:homeassistant -m "not escaping_notification and not expected_red"
asyncio_mode = auto
markers =
    escaping_notification: deliberately reaches a notification recipient outside the fixture. Deselected by default because it is *meant* to fail; test_notification_ledger runs it as a subprocess and asserts that it did.
    expected_red: a controlled-RED sentinel for a behaviour that is specified but not yet built. Deselected from the default suite because it is *meant* to fail for the length of a wave, and a suite that is red for a fortnight stops telling anyone anything. `npm run test:phase6:quick` selects them explicitly and requires each to fail for exactly its own named reason; a sentinel that starts passing is reported as implemented. Nothing here is skipped: assert-red.mjs rejects a skipped or zero-test run.
