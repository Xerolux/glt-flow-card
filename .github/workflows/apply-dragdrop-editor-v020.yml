name: Apply drag and drop editor v0.2.0

on:
  push:
    branches: [main]
    paths:
      - tools/apply-dragdrop-editor-v020.mjs
      - .github/workflows/apply-dragdrop-editor-v020.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-dragdrop-editor-v020.mjs
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/glt-flow-card.js package.json README.md README.de.md CHANGELOG.md test/smoke.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Add professional drag-and-drop GLT designer"
          git push
