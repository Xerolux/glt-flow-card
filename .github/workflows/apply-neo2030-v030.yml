name: Apply Neo 2030 v0.3.0

on:
  push:
    branches: [main]
    paths:
      - tools/apply-neo2030-v030.mjs
      - tools/fix-v030-payload.mjs
      - tools/v030-designer-*.b64
      - tools/v030-symbols.b64
      - .github/workflows/apply-neo2030-v030.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fix-v030-payload.mjs
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/glt-flow-card.js package.json package-lock.json README.md README.de.md CHANGELOG.md test/smoke.test.mjs examples/idm-neo2030.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Add Neo 2030 designer and native HA entity picker"
          git push
