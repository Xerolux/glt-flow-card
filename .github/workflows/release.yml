name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # tools/build.mjs derives the manifest's source commit from git history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - run: npm run verify:provenance
      # `verify:release` consumes the stage, so it is created first.
      - run: npm run stage:hacs
      - run: node tools/validate-hacs-staging.mjs
      - run: npm run verify:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run resolve:ha-minimum -- --max-candidates=12
      # The Phase-1 gate is mandatory and already runs the exact Home Assistant
      # artifact lanes, so it replaces a separate test:ha-artifacts step rather
      # than adding a second 30-minute pass over the same two images. Release
      # acceptance requires the evidence manifest it writes.
      - run: npm run test:phase1
      - run: npm run test:release-acceptance -- --tag=${{ github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-assets
          path: build/release/release-assets
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish verified release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-assets
          path: build/release-assets
      - name: Verify downloaded release identities
        shell: bash
        run: |
          cd build/release-assets
          sha256sum --check SHA256SUMS
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("release-provenance.json"));if(p.release.tag!==process.env.GITHUB_REF_NAME||p.verified!==true)process.exit(1)'
      - uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            build/release-assets/glt-flow-card.js
            build/release-assets/glt-flow-card-companion.zip
            build/release-assets/SHA256SUMS
            build/release-assets/release-provenance.json
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release-assets/* --verify-tag --generate-notes
