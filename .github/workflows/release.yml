name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Package optional companion backend
        run: zip -r glt-flow-card-companion.zip custom_components/glt_flow_card
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/glt-flow-card.js
            glt-flow-card-companion.zip
          generate_release_notes: true
