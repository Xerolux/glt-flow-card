name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'tools/build-site.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'README.de.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # The wiki job copies these files verbatim, so a missing or empty source
      # would silently delete a published page rather than fail here.
      - name: Every wiki source is present and non-empty
        run: |
          for file in README.md README.de.md docs/wiki/*.md; do
            test -s "$file" || { echo "empty or missing documentation source: $file"; exit 1; }
          done
      - name: The site build is deterministic
        run: |
          node tools/build-site.mjs
          mv _site _site-first
          node tools/build-site.mjs
          diff -r _site-first _site

  pages:
    name: Deploy Pages + online editor
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # These three Pages actions have no digest verified in this repository, so
      # they stay on their release tags rather than on an unverified SHA.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: node tools/build-site.mjs
      - name: Overlay professional GLT landing page
        run: cp -R docs/site/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  wiki:
    name: Sync GitHub Wiki
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Write is required to push the wiki repository and nothing else; the job
      # reads only docs/wiki, so it takes a shallow checkout.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Clone or initialise wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          if ! git clone "$url" /tmp/wiki 2>/dev/null; then
            mkdir -p /tmp/wiki
            git -C /tmp/wiki init -q -b master
            git -C /tmp/wiki remote add origin "$url"
          fi
      - name: Copy wiki sources
        run: |
          find /tmp/wiki -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md /tmp/wiki/
      - name: Commit and push wiki
        working-directory: /tmp/wiki
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: sync wiki from docs/wiki [skip ci]'
          # Never --force: the wiki is a repository other people can edit, and a
          # forced push would delete their history without a record.
          if ! git push origin HEAD; then
            echo "::warning title=Wiki not initialised::Open the Wiki tab once, create any page, save it, then re-run this workflow. GitHub creates the wiki repository only after the first manual page."
          fi
