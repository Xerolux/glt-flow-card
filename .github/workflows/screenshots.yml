name: UI Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/editor/**'
      - 'tools/capture-screenshots.mjs'
      - 'tools/update-readme-showcase.mjs'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Install browser tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build Pages locally
        run: |
          node tools/build-site.mjs
          cp -R docs/site/. _site/
      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/glt-pages.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/glt-pages.log
          exit 1
      - name: Capture current UI
        run: node tools/capture-screenshots.mjs
      - name: Update README showcase
        run: node tools/update-readme-showcase.mjs
      - name: Commit current screenshots and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/neo2030-live.png docs/images/operations-light-live.png docs/images/pid-dark-live.png docs/images/symbol-library-live.png docs/images/designer-live.png README.md README.de.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: refresh real UI screenshots and README [skip ci]'
          git push
