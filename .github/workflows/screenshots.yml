name: UI Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/editor/**'
      - 'tools/capture-screenshots.mjs'
      - 'tools/update-readme-showcase.mjs'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Install browser tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build Pages locally
        run: |
          node tools/build-site.mjs
          cp -R docs/site/. _site/
      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/glt-pages.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/glt-pages.log
          exit 1
      - name: Capture current UI
        run: node tools/capture-screenshots.mjs
      - name: Update README showcase
        run: node tools/update-readme-showcase.mjs
      - name: Commit current screenshots and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/images/neo2030-dark-live.png \
            docs/images/neo2030-light-live.png \
            docs/images/classic-scada-live.png \
            docs/images/pid-dark-live.png \
            docs/images/clean-live.png \
            docs/images/symbol-library-live.png \
            docs/images/designer-dark-live.png \
            docs/images/designer-light-live.png \
            README.md README.de.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: refresh dark, light and SCADA UI showcases'
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish screenshots after 5 attempts"
          exit 1
