name: Build Engineering Platform v1

on:
  push:
    branches: [main, v1-engineering-platform]
    paths:
      - "src/v100/**"
      - "custom_components/glt_flow_card/**"
      - "schemas/**"
      - "tools/build.mjs"
      - "tools/apply-v100.mjs"
      - "tools/generate-project-validators.mjs"
      - "tools/update-readme-v1.mjs"
      - "test/v100-*.test.mjs"
      - ".github/workflows/build-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glt-v1-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: npm ci --ignore-scripts
      - name: Verify deterministic authored and generated release outputs
        run: npm run verify:release
      - name: JavaScript tests
        run: npm test
      - name: Python syntax validation
        run: python -m py_compile custom_components/glt_flow_card/*.py
      - name: Stage local release packages
        run: |
          npm run stage:hacs
          npm run validate:hacs-staging
      - name: Upload verified release stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glt-v1-release-stage
          path: build/release
          if-no-files-found: error
          retention-days: 1
