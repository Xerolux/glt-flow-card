name: Build Engineering Platform v1

on:
  push:
    branches: [main, v1-engineering-platform]
    paths:
      - "src/v100/**"
      - "custom_components/glt_flow_card/**"
      - "schemas/**"
      - "tools/build.mjs"
      - "tools/apply-v100.mjs"
      - "tools/generate-project-validators.mjs"
      - "tools/update-readme-v1.mjs"
      - "test/v100-*.test.mjs"
      - ".github/workflows/build-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glt-v1-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # tools/build.mjs derives the manifest's source commit from git history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: npm ci --ignore-scripts
      - name: Install the declared Python test dependencies
        # `npm test` spawns the Companion modules for the cross-runtime parity
        # gates -- schedule, DST, site vocabulary, control rejection, bundle
        # exchange, diff impact and migration bytes -- and those modules import
        # Home Assistant. Without this the suite runs, reports 511 of 529, and
        # the 18 it drops are exactly the ones that compare the two runtimes.
        #
        # `validate.yml` gained this step when the same failure was diagnosed
        # there; this job was left behind, so it has been red on `main` since
        # 2026-09-01 while `validate` was green on the same commit. A parity
        # gate that cannot run is worse than one that fails: it looks like a
        # test suite passing.
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      # Stage first: `verify:release` consumes the stage to prove the packages
      # that will ship are the bytes it just verified. It never creates one.
      - name: Stage local release packages
        run: |
          npm run stage:hacs
          node tools/validate-hacs-staging.mjs
      - name: Verify deterministic authored and generated release outputs
        run: npm run verify:release
      - name: JavaScript tests
        run: npm test
      - name: Clean tracked-export gate
        run: node tools/test-clean-checkout.mjs
      - name: Python syntax validation
        run: python -m py_compile custom_components/glt_flow_card/*.py
      - name: Upload verified release stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glt-v1-release-stage
          path: build/release
          if-no-files-found: error
          retention-days: 1
