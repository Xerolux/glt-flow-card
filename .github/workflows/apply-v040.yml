name: Apply Engineering Workspace v0.4.0

# Retired as an automatic job, kept runnable on purpose.
#
# This bundles `src/v040-extension.part*` and hands the result to
# `tools/apply-v040.mjs`, which sets `package.json` to **0.4.0**, rewrites
# `dist/glt-flow-card.js`, both READMEs, the changelog and the smoke test, and
# then commits and pushes to `main`.
#
# The product is 1.1. Running this against it is a downgrade that lands as a
# bot commit on the default branch, so it must not be reachable by a push.
#
# It is presently harmless for one accidental reason rather than by design:
# `apply-v040.mjs` looks for `const VERSION = "0.3.0"` or `"0.4.0"` in the
# shipped bundle, finds `"1.0.0"`, and throws before the commit step. That is a
# thrown exception standing in for a safety property, and it stops being true
# the day anything touches that anchor.
#
# So the push trigger is removed rather than left to fail. `workflow_dispatch`
# stays: the job is still reachable, still runnable by a person who means it,
# and still the only thing that knows how to bundle the seven parts -- which is
# the same "reachable and inert beats deleted" rule this repository applies to
# retired routes. Re-bundling the v0.4 parts into a 1.x artifact needs
# `apply-v040.mjs` taught the current version anchor first; that is a build
# decision, and it is recorded in `05-SUMMARY.md` rather than taken here.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glt-v040-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm install --save-dev js-yaml@^4.1.0 esbuild@^0.25.0 marked@^15.0.0
      - name: Bundle workspace extension
        run: |
          cat src/v040-extension.part* > src/v040-extension.tmp.js
          npx esbuild src/v040-extension.tmp.js --bundle --format=iife --target=es2022 --banner:js='/*! GLT Flow Card v0.4 extensions */' --outfile=/tmp/glt-v040.js
          rm src/v040-extension.tmp.js
      - name: Apply v0.4 to production bundle and docs
        run: node tools/apply-v040.mjs /tmp/glt-v040.js
      - name: Install/check generated package lock
        run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: node --test test/v040.test.mjs
      - name: Build documentation site
        run: node tools/build-site.mjs
      - name: Commit generated production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Xerolux@users.noreply.github.com"
          git add dist/glt-flow-card.js package.json package-lock.json README.md README.de.md CHANGELOG.md test/smoke.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Add GLT engineering workspace v0.4.0"
          git push
