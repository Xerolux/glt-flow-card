name: HACS Categories

on:
  push:
    branches: [main]
    paths:
      - "custom_components/glt_flow_card/**"
      - "dist/**"
      - "packaging/**"
      - "tools/stage-hacs-packages.mjs"
      - "tools/validate-hacs-staging.mjs"
      - ".github/workflows/hacs.yml"
  pull_request:
    paths:
      - "custom_components/glt_flow_card/**"
      - "dist/**"
      - "packaging/**"
      - "tools/stage-hacs-packages.mjs"
      - "tools/validate-hacs-staging.mjs"
      - ".github/workflows/hacs.yml"

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run stage:hacs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hacs-category-stage
          path: build/release
          if-no-files-found: error
          retention-days: 1

  plugin:
    needs: stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hacs-category-stage
          path: build/release
      - run: node tools/validate-hacs-staging.mjs --category plugin

  integration:
    needs: stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hacs-category-stage
          path: build/release
      - run: node tools/validate-hacs-staging.mjs --category integration
